[project]
name = "modop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1",
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # openpyxl signale les extensions qu'il ne gere pas. Le programme les
    # restaure lui-meme (voir services/xlsx_extensions.py) et reformule
    # l'avertissement dans son journal.
    "ignore:.*extension is not supported.*:UserWarning",
]